name: Release

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub Release
      id-token: write # OIDC trusted publishing and provenance
    env:
      HUSKY: 0
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history so changelogithub can read every commit since the last tag
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      # No registry-url here and no NPM_TOKEN anywhere in this workflow. Either one writes
      # an .npmrc auth placeholder that shadows OIDC and breaks the token-less publish.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      # Trusted publishing needs npm 11.5.1 or newer, pinned to major 11 so a future npm
      # release cannot change the publish path
      - run: npm install --global npm@^11.5.1
      - run: npm --version
      - run: bun install --frozen-lockfile
      - run: bun run format:check
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run sync:check
      - run: bun run build:codegen
      - run: bun test
      - run: bunx changelogithub
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: bun run scripts/publish.ts
